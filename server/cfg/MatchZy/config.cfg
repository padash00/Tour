// F16 Arena — настройки MatchZy (выполняется при загрузке плагина).
// Исходник: tournament/server/cfg/MatchZy/config.cfg → копируется install.ps1 в game/csgo/cfg/MatchZy/

// На сервер пускаем только игроков загруженного матча (составы приходят с сайта по SteamID)
matchzy_kick_when_no_match_loaded true
matchzy_whitelist_enabled_default false

// Матч стартует, только когда все игроки обеих команд написали .ready (10/10)
matchzy_minimum_ready_required 0
matchzy_allow_force_ready true

// Ножевой раунд, победитель выбирает сторону: .stay / .switch
matchzy_knife_enabled_default true

// Демо каждой карты
matchzy_demo_recording_enabled true
matchzy_demo_path MatchZy/
matchzy_demo_name_format "{TIME}_{MATCH_ID}_map{MAPNUMBER}_{MAP}_{TEAM1}_vs_{TEAM2}"
matchzy_demo_upload_url ""

// Паузы
matchzy_use_pause_command_for_tactical_pause false
matchzy_enable_tech_pause true
matchzy_tech_pause_flag ""
matchzy_tech_pause_duration 300
matchzy_max_tech_pauses_allowed 2
matchzy_pause_after_restore true
matchzy_stop_command_available false

matchzy_playout_enabled_default false
matchzy_reset_cvars_on_series_end true
matchzy_autostart_mode 1
matchzy_everyone_is_admin false
matchzy_show_credits_on_match_start false
matchzy_enable_damage_report true

matchzy_chat_prefix [{LightBlue}F16{Default}]
matchzy_admin_chat_prefix [{Red}F16 ADMIN{Default}]
matchzy_hostname_format "F16 Arena | {TEAM1} vs {TEAM2}"
matchzy_match_start_message "{LightBlue}F16 Arena{Default} — удачной игры! $$$ Статистика матча — на tournament.f16-arena.kz"
