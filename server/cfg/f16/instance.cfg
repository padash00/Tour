// F16 Arena — общие настройки для всех инстансов CS2.
// Конкретный инстанс задаёт hostname / rcon_password в f16/cs2-0N.cfg (генерирует install.ps1).

sv_lan 0                      // Steam-аутентификация остаётся включённой (сервер ходит в интернет только исходящими)
sv_hibernate_when_empty 0
sv_visiblemaxplayers 11       // 10 игроков + 1 observer
sv_allow_votes 0
sv_cheats 0

// SourceTV нужен MatchZy для записи демо; трансляция наружу не нужна
tv_enable 1
tv_autorecord 0
tv_delay 0
tv_maxclients 0

// логи
log on
sv_logfile 1
sv_logbans 1
// наблюдатели разрешены всегда
mp_allowspectators 1
