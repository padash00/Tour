// F16 Arena — общие настройки для всех инстансов CS2.
// Конкретный инстанс задаёт hostname / rcon_password в f16/cs2-0N.cfg (генерирует install.ps1).

sv_lan 0                      // Steam-аутентификация остаётся включённой (сервер ходит в интернет только исходящими)
// Срыв проверки Steam не выкидывает игроков (25.11.2026: при заминке Steam сервер разом кикнул 8 человек посреди раунда).
// Вход по-прежнему только через Steam, состав матча MatchZy сверяет по SteamID.
sv_steamauth_enforce 0
sv_hibernate_when_empty 0
sv_visiblemaxplayers 20       // 10 игроков + наблюдатели и оператор трансляции (-maxplayers 20)
sv_allow_votes 0
sv_cheats 0

// SourceTV нужен MatchZy для записи демо; трансляция наружу не нужна
tv_enable 1
tv_autorecord 0
tv_delay 0
tv_maxclients 0

// логи
log on
sv_logfile 1
sv_logbans 1

// наблюдатели разрешены всегда

mp_allowspectators 1

